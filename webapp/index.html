<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09070f">
  <title>SMF SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/assets/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-row brand-row">
      <a class="brand" href="/app" data-nav="home" id="brand-home">
        <span class="brand-mark">S</span>
        <span class="brand-name">SMF SHOP</span>
      </a>
      <nav class="nav-links" aria-label="Shop">
        <button type="button" class="nav-link" data-filter="subscription" id="nav-subscription">Subscription</button>
        <button type="button" class="nav-link" data-filter="freebies" id="nav-freebies">Freebies</button>
        <button type="button" class="nav-link nav-signin" id="btn-signin">Sign in</button>
      </nav>
    </div>
    <div class="topbar-row tools-row">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm11 3-5.2-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="Search premium tools..." autocomplete="off">
      </label>
      <div class="tool-cluster">
        <div class="dropdown" id="currency-dd">
          <button type="button" class="chip" id="currency-btn" aria-haspopup="listbox" aria-expanded="false">USD ($)</button>
          <div class="menu" role="listbox" hidden></div>
        </div>
        <div class="dropdown" id="language-dd">
          <button type="button" class="chip" id="language-btn" aria-haspopup="listbox" aria-expanded="false">🇬🇧 English</button>
          <div class="menu" role="listbox" hidden></div>
        </div>
        <button type="button" class="icon-btn" id="btn-cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h15l-1.4 8.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.7L5.2 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.2" fill="currentColor"/><circle cx="18" cy="20" r="1.2" fill="currentColor"/></svg>
          <span class="badge" id="cart-count" hidden>0</span>
        </button>
        <button type="button" class="icon-btn avatar-btn" id="btn-account" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.2 0-8 2.1-8 5v1h16v-1c0-2.9-3.8-5-8-5Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="shop-eyebrow">Live premium catalog</p>
        <h1 id="shop-headline">Premium plans, without the wait.</h1>
        <p class="lede" id="shop-tagline">AI tools, streaming, and SaaS accounts — live stock, Telegram prices.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#catalog" id="btn-explore">Explore Products</a>
          <a class="btn btn-whatsapp" id="btn-whatsapp" href="#" target="_blank" rel="noopener">WhatsApp order</a>
        </div>
      </div>
      <aside class="featured" aria-label="Featured products">
        <article class="rail" data-rail="live">
          <header class="rail-head">
            <span class="rail-dot live"></span>
            <h2>Live</h2>
            <span class="rail-count" id="live-count">0</span>
          </header>
          <div class="rail-list" id="rail-live"></div>
        </article>
        <article class="rail" data-rail="hot">
          <header class="rail-head">
            <span class="rail-dot hot"></span>
            <h2>Hot</h2>
            <span class="rail-count" id="hot-count">0</span>
          </header>
          <div class="rail-list" id="rail-hot"></div>
        </article>
        <article class="rail" data-rail="best_seller">
          <header class="rail-head">
            <span class="rail-dot best"></span>
            <h2>Best Seller</h2>
            <span class="rail-count" id="best-count">0</span>
          </header>
          <div class="rail-list" id="rail-best"></div>
        </article>
      </aside>
    </section>

    <section class="catalog" id="catalog">
      <div class="catalog-head">
        <div>
          <h2 id="catalog-title">Explore products</h2>
          <p class="muted" id="catalog-sub">Same catalog and prices as the Telegram shop.</p>
        </div>
      </div>
      <div class="pills" id="category-pills"></div>
      <div class="grid" id="product-grid"></div>
    </section>
  </main>

  <button type="button" class="fab" id="btn-support" aria-label="Support">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.8A3.8 3.8 0 0 1 8.8 3h6.4A3.8 3.8 0 0 1 19 6.8v5.4A3.8 3.8 0 0 1 15.2 16H10l-4.2 3.1c-.7.5-1.8 0-1.8-.9V6.8Z" fill="currentColor"/></svg>
  </button>

  <div class="sheet" id="product-sheet" hidden>
    <div class="sheet-card">
      <button type="button" class="sheet-close" data-close="product" aria-label="Close">×</button>
      <div id="product-sheet-body"></div>
    </div>
  </div>

  <div class="sheet" id="cart-sheet" hidden>
    <div class="sheet-card">
      <button type="button" class="sheet-close" data-close="cart" aria-label="Close">×</button>
      <h2>Cart</h2>
      <div id="cart-body"></div>
    </div>
  </div>

  <div class="sheet" id="account-sheet" hidden>
    <div class="sheet-card">
      <button type="button" class="sheet-close" data-close="account" aria-label="Close">×</button>
      <h2 id="account-title">Account</h2>
      <div id="account-body"></div>
    </div>
  </div>

  <script src="/app/assets/app.js"></script>
</body>
</html>
