<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09051A">
  <title>SMF Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/mini-app/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden>S</span>
        SMF <span>Shop</span>
      </div>
      <button type="button" class="icon-btn" id="cart-btn" aria-label="Cart">
        🛒
        <span class="badge hidden" id="cart-count">0</span>
      </button>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">Premium Digital Marketplace</p>
        <h1>Unlock Premium Access.<br><span>Intelligence Without Limits.</span></h1>
        <p class="lede">Live prices from SMF Shop. Instant delivery, warranty on every listing.</p>
      </section>

      <section class="catalog">
        <h2>Shop catalog</h2>
        <p class="sub">Live prices · Instant delivery · Warranty on every listing</p>
        <input id="search" type="search" placeholder="Search products…" aria-label="Search products">
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
        <p class="empty hidden" id="empty">No products match this filter.</p>
      </section>
    </main>
  </div>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <script src="/static/mini-app/app.js"></script>
</body>
</html>
